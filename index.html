<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>portgas crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark">portgas</span><span class="crew">crew</span></div>
  <div class="status" id="status"></div>
</header>

<main id="main"></main>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="matches" class="on">Matches</button>
  <button data-tab="crew">Crew</button>
  <button data-tab="picks">My picks <span class="badge" id="picksBadge" hidden></span></button>
  <button data-tab="desk">Desk</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
